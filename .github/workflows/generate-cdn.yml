name: Generate CDN CSS

on:
  push:
    paths:
      - "backgrounds/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CSS
        run: |
          python << 'PY'
          from pathlib import Path

          username = "PadmaRoshini04"
          repository = "for-ao3"
          branch = "main"

          extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".gif",
              ".webp"
          }

          css = []

          for image in sorted(Path("backgrounds").rglob("*")):
              if image.is_file() and image.suffix.lower() in extensions:

                  path = image.as_posix()

                  url = (
                      f"https://cdn.jsdelivr.net/gh/"
                      f"{username}/{repository}@{branch}/{path}"
                  )

                  css.append(
                      f'/* {path} */'
                  )
                  css.append(
                      f'background-image: url("{url}");'
                  )
                  css.append("")

          Path("assets.css").write_text(
              "\n".join(css),
              encoding="utf-8"
          )
          PY

      - name: Commit generated CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets.css

          git diff --cached --quiet || git commit -m "Update generated CDN CSS"

          git push
